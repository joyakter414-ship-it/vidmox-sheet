<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1F4E78" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>VidMox Sheet</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar" id="topbar" hidden>
    <button class="icon-btn" id="backBtn" aria-label="Back" hidden>
      <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="topbar-title">
      <div class="brand" id="topTitle">VidMox Sheet</div>
      <div class="sub" id="topSub"></div>
    </div>
    <button class="icon-btn" id="logoutBtn" aria-label="Log out" title="Log out">
      <svg viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg>
    </button>
  </header>

  <main id="app"></main>

  <!-- bottom sheet modal -->
  <div class="modal-backdrop" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-handle"></div>
      <h2 id="modalTitle"></h2>
      <form id="modalForm" autocomplete="off"></form>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="/app.js" type="module"></script>
</body>
</html>
