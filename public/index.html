<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0A0D14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Vidmox Sheet · Dedicated Video Team</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/png" href="/vidmox-logo.png" />
  <link rel="apple-touch-icon" href="/vidmox-logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar" id="topbar" hidden>
    <button class="icon-btn" id="backBtn" aria-label="Back" hidden>
      <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="topbar-brand">
      <img src="/vidmox-logo.png" alt="Vidmox" class="topbar-logo" />
      <div class="topbar-title">
        <div class="brand" id="topTitle">Vidmox Sheet</div>
        <div class="sub" id="topSub"></div>
      </div>
    </div>
    <div class="topbar-actions" style="display:flex;align-items:center;gap:6px;">
      <button class="icon-btn" id="changePassBtn" aria-label="Change Password" title="Change Password">
        <svg viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="M10.85 12.15L19 4M18 5l2 2M15 8l2 2"/></svg>
      </button>
      <button class="icon-btn" id="logoutBtn" aria-label="Log out" title="Log out">
        <svg viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg>
      </button>
    </div>
  </header>

  <main id="app"></main>

  <!-- bottom sheet modal -->
  <div class="modal-backdrop" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-handle"></div>
      <h2 id="modalTitle"></h2>
      <form id="modalForm" autocomplete="off"></form>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="/app.js?v=3" type="module"></script>
</body>
</html>
